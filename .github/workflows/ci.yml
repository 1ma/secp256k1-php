name: Continuous Integration

on:
  push:
  schedule:
    - cron: 21 21 21 * *
  workflow_dispatch:

jobs:
  build:
    name: PHP ${{ matrix.php-version }} ${{ matrix.thread-safety }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        php-version: [ "8.2", "8.3", "8.4", "8.5", "8.6" ]
        thread-safety: [ "nts", "zts" ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        env:
          debug: true
          phpts: ${{ matrix.thread-safety }}
        with:
          php-version: ${{ matrix.php-version }}
          ini-values: opcache.enable=1, opcache.enable_cli=1, opcache.protect_memory=1
          coverage: none
      - name: Build PHP extension
        run: |
          sudo apt install libsecp256k1-dev
          composer ext:build
          ldd modules/secp256k1.so
      - name: Test PHP extension
        run: |
          php -v
          sudo apt-get install valgrind
          composer ext:test-valgrind
  coverage:
    name: Generate coverage report and badge
    runs-on: ubuntu-26.04
    needs:
      - build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: "8.5"
      - run: |
          sudo apt install lcov libsecp256k1-dev
          composer ext:build-cov
          composer ext:test
          composer ext:cov-report
      - uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          file: coverage.info
          format: lcov
